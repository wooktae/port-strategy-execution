name: Execution CodeBuild

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the verified build-only image to ECR
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  codebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CODEBUILD_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Start Execution CodeBuild
        shell: bash
        env:
          PROJECT_NAME: portfolio-strategy-execution-build
          PUSH_IMAGE: ${{ inputs.push_image }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PUSH_VALUE="false"

          if [[ "${PUSH_IMAGE}" == "true" ]]; then
            PUSH_VALUE="true"
          fi

          BUILD_ID="$(
            aws codebuild start-build               --project-name "${PROJECT_NAME}"               --source-version "${SOURCE_SHA}"               --environment-variables-override                 name=PUSH_IMAGE,value="${PUSH_VALUE}",type=PLAINTEXT                 name=RELEASE_STAGE,value=BUILD_ONLY,type=PLAINTEXT               --query "build.id"               --output text
          )"

          if [[ -z "${BUILD_ID}" || "${BUILD_ID}" == "None" ]]; then
            echo "BUILD_ID=EMPTY"
            exit 10
          fi

          echo "BUILD_ID=${BUILD_ID}"
          echo "SOURCE_SHA=${SOURCE_SHA}"
          echo "PUSH_IMAGE=${PUSH_VALUE}"
          echo "RELEASE_STAGE=BUILD_ONLY"
          echo "ORDER_EXECUTION=DISABLED"

          while true; do
            BUILD_STATUS="$(
              aws codebuild batch-get-builds                 --ids "${BUILD_ID}"                 --query "builds[0].buildStatus"                 --output text
            )"

            echo "BUILD_STATUS=${BUILD_STATUS}"

            case "${BUILD_STATUS}" in
              SUCCEEDED)
                echo "EXECUTION_CODEBUILD_TRIGGER=SUCCESS"
                echo "DEPLOYMENT_EXECUTED=NO"
                echo "PROGRESSIVE_RELEASE_EXECUTED=NO"
                break
                ;;

              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "EXECUTION_CODEBUILD_TRIGGER=FAILED"
                exit 20
                ;;

              IN_PROGRESS)
                sleep 15
                ;;

              *)
                echo "UNKNOWN_BUILD_STATUS=${BUILD_STATUS}"
                exit 30
                ;;
            esac
          done
